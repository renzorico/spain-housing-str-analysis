# Build the site and publish it to GitHub Pages.
# The site data in site/public/data is committed (exported locally with
# scripts/export_site_data.py), so CI needs no Python data pipeline.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/test_export.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Privacy gate: the published data must not contain ids, names,
      # licence text or addresses. pipx is preinstalled on the runner; plain
      # pip into the system Python is blocked (PEP 668).
      - name: Check exported data for identifying fields
        run: pipx run pytest -q tests/test_export.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      - name: Typecheck and build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
